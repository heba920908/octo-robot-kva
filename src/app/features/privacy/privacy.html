<section id="aviso" class="privacy" aria-labelledby="aviso-title">
  <div class="kva-section-heading">
    <h2 id="aviso-title" class="kva-type-h1" tabindex="-1">{{ notice.title }}</h2>
    <span class="kva-corner-rule" aria-hidden="true"></span>
  </div>
  @for (section of notice.sections; track section.id) {
    <h3>{{ section.heading }}</h3>
    @for (paragraph of section.paragraphs; track $index) {
      <p>{{ paragraph }}</p>
    }
  }
</section>
